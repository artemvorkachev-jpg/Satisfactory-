<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101820">
<title>Satisfactory — Web Prototype</title>
<style>
:root{color-scheme:dark;--bg:#101820;--panel:#192630;--line:#354650;--text:#edf3f5;--muted:#a5b4ba;--accent:#f2b300;--green:#8ccf68}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none}#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
.hud{position:fixed;z-index:3;pointer-events:none}.panel{background:#111c24df;border:1px solid #53616a;border-radius:10px;padding:10px 12px;backdrop-filter:blur(8px);pointer-events:auto;box-shadow:0 4px 20px #0005}
#top{top:env(safe-area-inset-top,8px);left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}#brand{font-weight:800;color:var(--accent)}#objective{font-size:12px;color:var(--muted);max-width:55vw}#stats{font-variant-numeric:tabular-nums;font-size:12px;text-align:right}
#bottom{left:10px;right:10px;bottom:env(safe-area-inset-bottom,8px);display:flex;justify-content:space-between;align-items:end;gap:8px}#inventory{max-width:min(54vw,420px);font-size:12px;line-height:1.55}#actions{display:flex;flex-wrap:wrap;justify-content:end;gap:6px;max-width:50vw}
button{border:1px solid #65747c;background:#1b2a34;color:#fff;border-radius:8px;padding:9px 11px;font:600 12px system-ui;touch-action:manipulation}button.primary{background:#8d6500;border-color:#e0aa19}button:disabled{opacity:.4}
#center{left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;max-width:80vw}#prompt{font-weight:700;font-size:14px}#message{font-size:12px;color:var(--muted);margin-top:4px}
#crosshair{position:fixed;z-index:2;left:50%;top:50%;width:12px;height:12px;transform:translate(-50%,-50%);pointer-events:none}#crosshair:before,#crosshair:after{content:"";position:absolute;background:#fff9;box-shadow:0 0 3px #000}#crosshair:before{width:12px;height:1px;top:5px}#crosshair:after{height:12px;width:1px;left:5px}
#touch{position:fixed;z-index:4;inset:0;pointer-events:none}.stick{position:absolute;left:20px;bottom:95px;width:116px;height:116px;border-radius:50%;border:1px solid #ffffff55;background:#182a3588;pointer-events:auto;touch-action:none}.nub{position:absolute;left:37px;top:37px;width:40px;height:40px;border-radius:50%;background:#e7edf077;border:1px solid #fff9}.touchBtns{position:absolute;right:14px;bottom:95px;display:grid;grid-template-columns:repeat(2,64px);gap:8px;pointer-events:auto}.touchBtns button{height:54px;background:#182a35dd}
#menu{position:fixed;z-index:6;inset:0;background:#071017cc;display:none;place-items:center;padding:16px}.menuCard{width:min(520px,100%);max-height:85vh;overflow:auto;background:#182630;border:1px solid #56656e;border-radius:14px;padding:16px}.menuCard h2{margin:0 0 10px;font-size:18px}.menuGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.menuGrid button{text-align:left;min-height:58px}.small{color:var(--muted);font-size:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}
@media(min-width:850px){#touch{display:none}#actions{max-width:460px}#inventory{max-width:420px}#top{left:18px;right:18px}#bottom{left:18px;right:18px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
</head>
<body>
<div id="game"></div><div id="crosshair"></div>
<div class="hud" id="top"><div class="panel"><div id="brand">FICSIT // FIELD OPERATIONS</div><div id="objective">Задача: осмотреть площадку и собрать ресурсы</div></div><div class="panel" id="stats">Энергосеть: нет<br>Стадия: HUB 0</div></div>
<div class="hud" id="center"><div class="panel"><div id="prompt">Исследуйте площадку</div><div id="message">WASD — движение · мышь — обзор · E — взаимодействие</div></div></div>
<div class="hud" id="bottom"><div class="panel" id="inventory">Инвентарь: пусто</div><div id="actions"><button id="craft">Крафт</button><button id="build" class="primary">Строительство</button><button id="save">Сохранить</button><button id="help">Управление</button></div></div>
<div id="touch"><div class="stick" id="stick"><div class="nub" id="nub"></div></div><div class="touchBtns"><button id="look">ОБЗОР</button><button id="interact">E · ВЗЯТЬ</button><button id="jump">ПРЫЖОК</button><button id="menuBtn">МЕНЮ</button></div></div>
<div id="menu"><div class="menuCard"><h2 id="menuTitle">Строительство</h2><div class="small" id="menuInfo">Выберите действие.</div><div class="menuGrid" id="menuGrid"></div><div class="row"><span class="small" id="menuStatus"></span><button id="closeMenu">Закрыть</button></div></div></div>
<script type="module" src="./main.js"></script>
</body></html>
