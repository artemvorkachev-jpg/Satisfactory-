name: Build Blender asset blockouts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/blender/**"\n      - "tools/audio/**"
      - ".github/workflows/build-blender-assets.yml"

concurrency:
  group: blender-assets-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install Blender and exporter dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgl1 libxkbcommon0 libxrender1 libxi6 libxxf86vm1 xvfb
          blender --version
          python3 -c "import numpy; print('System NumPy:', numpy.__version__)"

      - name: Generate original stereo sound effects\n        run: python3 tools/audio/generate_original_audio.py\n\n      - name: Generate starter machine assets
        run: PYTHONPATH=/usr/lib/python3/dist-packages blender --background --python-use-system-env --python tools/blender/generate_starter_assets.py

      - name: Generate production buildings and extractors\n        run: PYTHONPATH=/usr/lib/python3/dist-packages blender --background --python-use-system-env --python tools/blender/generate_production_buildings_batch.py\n\n      - name: Generate Jetpack variants
        run: PYTHONPATH=/usr/lib/python3/dist-packages blender --background --python-use-system-env --python tools/blender/generate_jetpack_variants.py

      - name: Generate Hoverpack variants
        run: PYTHONPATH=/usr/lib/python3/dist-packages blender --background --python-use-system-env --python tools/blender/generate_hoverpack_variants.py

      - name: Generate Blade Runners variants
        run: PYTHONPATH=/usr/lib/python3/dist-packages blender --background --python-use-system-env --python tools/blender/generate_blade_runners_variants.py

      - name: Generate Parachute variants
        run: PYTHONPATH=/usr/lib/python3/dist-packages blender --background --python-use-system-env --python tools/blender/generate_parachute_variants.py

      - name: Generate Gas Mask variants
        run: PYTHONPATH=/usr/lib/python3/dist-packages blender --background --python-use-system-env --python tools/blender/generate_gas_mask_variants.py

      - name: Generate Object Scanner variants
        run: PYTHONPATH=/usr/lib/python3/dist-packages blender --background --python-use-system-env --python tools/blender/generate_object_scanner_variants.py

      - name: Generate Hazmat Suit variants
        run: PYTHONPATH=/usr/lib/python3/dist-packages blender --background --python-use-system-env --python tools/blender/generate_hazmat_suit_variants.py

      - name: Generate Cup variants
        run: PYTHONPATH=/usr/lib/python3/dist-packages blender --background --python-use-system-env --python tools/blender/generate_cup_variants.py

      - name: Generate Portable Miner variants
        run: PYTHONPATH=/usr/lib/python3/dist-packages blender --background --python-use-system-env --python tools/blender/generate_portable_miner_variants.py

      - name: Generate Drone variants
        run: PYTHONPATH=/usr/lib/python3/dist-packages blender --background --python-use-system-env --python tools/blender/generate_drone_variants.py

      - name: Generate Tractor variants
        run: PYTHONPATH=/usr/lib/python3/dist-packages blender --background --python-use-system-env --python tools/blender/generate_tractor_variants.py

      - name: Generate Truck variants
        run: PYTHONPATH=/usr/lib/python3/dist-packages blender --background --python-use-system-env --python tools/blender/generate_truck_variants.py

      - name: Generate Explorer variants
        run: PYTHONPATH=/usr/lib/python3/dist-packages blender --background --python-use-system-env --python tools/blender/generate_explorer_variants.py

      - name: Generate Cyber Wagon variants
        run: PYTHONPATH=/usr/lib/python3/dist-packages blender --background --python-use-system-env --python tools/blender/generate_cyber_wagon_variants.py

      - name: Generate Factory Cart variants
        run: PYTHONPATH=/usr/lib/python3/dist-packages blender --background --python-use-system-env --python tools/blender/generate_factory_cart_variants.py

      - name: Generate Electric Locomotive variants
        run: PYTHONPATH=/usr/lib/python3/dist-packages blender --background --python-use-system-env --python tools/blender/generate_locomotive_variants.py

      - name: Generate Freight Car variants
        run: PYTHONPATH=/usr/lib/python3/dist-packages blender --background --python-use-system-env --python tools/blender/generate_freight_car_variants.py

      - name: Generate Train Station variants
        run: PYTHONPATH=/usr/lib/python3/dist-packages blender --background --python-use-system-env --python tools/blender/generate_train_station_variants.py

      - name: Generate Freight Platform variants
        run: PYTHONPATH=/usr/lib/python3/dist-packages blender --background --python-use-system-env --python tools/blender/generate_freight_platform_variants.py

      - name: Generate Railway variants
        run: PYTHONPATH=/usr/lib/python3/dist-packages blender --background --python-use-system-env --python tools/blender/generate_railway_variants.py

      - name: Render four-variant review sheets
        run: |
          mkdir -p assets/models/previews
          find assets/models -type f -name "*_four_variants.blend" -print0 | while IFS= read -r -d '' file; do
            xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 PYTHONPATH=/usr/lib/python3/dist-packages blender --background "$file" --python-use-system-env --python tools/blender/render_single_asset_preview.py
          done

      - name: Verify generated assets and review sheets
        run: |
          test "$(find assets/models -type f -name "*.blend" | wc -l)" -ge 35
          test "$(find assets/models -type f -name "*.glb" | wc -l)" -ge 139
          test "$(find assets/models/previews -type f -name "*_preview.png" | wc -l)" -ge 34

      - name: Commit Blender sources, GLB exports and preview sheets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add assets/models/ assets/audio/
          if git diff --cached --quiet; then
            echo "No generated asset changes."
            exit 0
          fi
          git commit -m "Generate Blender blockouts, exports and review previews"
          git push
