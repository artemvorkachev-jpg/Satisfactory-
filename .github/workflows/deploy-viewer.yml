name: Deploy Satisfactory 3D viewer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-viewer.yml"
  workflow_run:
    workflows: ["Build Blender asset blockouts"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble lightweight viewer site
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp -R viewer _site/viewer
          python3 - <<'PY'
          import json, os, shutil
          root = os.getcwd()
          site = os.path.join(root, "_site")
          catalog = json.load(open(os.path.join(root, "viewer", "catalog.json"), encoding="utf-8"))
          copied = set()
          for asset in catalog.get("assets", []):
              for rel in asset.get("variants", {}).values():
                  if rel not in copied:
                      dst = os.path.join(site, rel)
                      os.makedirs(os.path.dirname(dst), exist_ok=True)
                      shutil.copy2(os.path.join(root, rel), dst)
                      copied.add(rel)
              preview = asset.get("preview")
              if preview and preview not in copied:
                  dst = os.path.join(site, preview)
                  os.makedirs(os.path.dirname(dst), exist_ok=True)
                  shutil.copy2(os.path.join(root, preview), dst)
                  copied.add(preview)
          texture_root = os.path.join(root, "assets", "textures")
          if os.path.isdir(texture_root):
              shutil.copytree(texture_root, os.path.join(site, "assets", "textures"), dirs_exist_ok=True)
          print("Viewer assets copied:", len(copied))
          PY
          test -f _site/viewer/catalog.json
          echo "Viewer catalogue entries: $(python3 -c 'import json; print(json.load(open("_site/viewer/catalog.json"))["count"])')"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
