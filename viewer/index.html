<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111820">
<title>Satisfactory — 3D Asset Viewer</title>
<style>
:root{color-scheme:dark;--bg:#10161c;--panel:#19232c;--line:#2b3a45;--text:#e8eef2;--muted:#9aaab4;--accent:#f2a900}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{height:58px;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line);background:#151e26}
.logo{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#111;font-weight:900}
header strong{font-size:16px}header span{color:var(--muted)}
main{height:calc(100% - 58px);display:grid;grid-template-columns:310px minmax(0,1fr)}
aside{min-width:0;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel)}
.filters{padding:12px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
input,select,button{font:inherit;color:var(--text);background:#101820;border:1px solid var(--line);border-radius:8px;padding:10px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.count{color:var(--muted);font-size:12px}
#assetList{overflow:auto;padding:8px;display:grid;align-content:start;gap:5px}
.asset{display:flex;gap:10px;align-items:center;text-align:left;width:100%;cursor:pointer}
.asset:hover,.asset.active{border-color:var(--accent);background:#26323b}
.thumb{width:58px;height:42px;object-fit:cover;border-radius:5px;background:#0b1116}
.asset-name{font-weight:600;display:block;overflow-wrap:anywhere}.asset-meta{font-size:11px;color:var(--muted);display:block;margin-top:3px}
section{position:relative;min-width:0;min-height:0}
#stage{position:absolute;inset:0;background:radial-gradient(ellipse at center,#26343d,#10161c 70%)}
#stage canvas{display:block;width:100%;height:100%}
.toolbar{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.toolbar>*{pointer-events:auto}
.pill{background:#17222bcc;border:1px solid #43515b;border-radius:10px;padding:9px 12px;backdrop-filter:blur(8px)}
#modelTitle{font-weight:700}#modelInfo{font-size:11px;color:var(--muted);margin-top:3px}
.controls{display:flex;gap:7px;align-items:center}
select{padding:8px;background:#17222b}
#hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);white-space:nowrap;color:var(--muted);background:#17222bcc;padding:8px 12px;border:1px solid #43515b;border-radius:9px;pointer-events:none}
#message{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted);pointer-events:none}
@media(max-width:760px){header{height:48px;padding:0 12px}main{height:calc(100% - 48px);grid-template-columns: minmax(0,1fr);grid-template-rows:42% 58%}aside{grid-row:2;border-right:0;border-top:1px solid var(--line)}section{grid-row:1;grid-column:1}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.count{grid-column:1/-1}#assetList{grid-template-columns:1fr 1fr;gap:6px}.asset{padding:6px;min-width:0}.thumb{width:42px;height:36px}.asset-name{font-size:12px}.toolbar{top:8px;left:8px;right:8px}.pill{padding:7px 9px}#hint{bottom:7px;font-size:10px}.controls select{max-width:76px}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}
</script>
</head>
<body>
<header><div class="logo">S</div><strong>Satisfactory</strong><span>3D Asset Viewer</span></header>
<main>
<aside>
 <div class="filters">
  <input id="search" type="search" placeholder="Поиск модели…" autocomplete="off">
  <select id="category"><option value="">Все категории</option></select>
  <div class="count" id="count">Загрузка каталога…</div>
 </div>
 <div id="assetList"></div>
</aside>
<section>
 <div id="stage"></div>
 <div class="toolbar">
  <div class="pill"><div id="modelTitle">Выберите модель</div><div id="modelInfo">Поворачивайте и приближайте модель</div></div>
  <div class="controls pill"><label for="variant">Вариант</label><select id="variant"><option value="a">A</option><option value="b">B</option><option value="c">C</option><option value="d">D</option></select><button id="reset" type="button">Сброс</button></div>
 </div>
 <div id="hint">Вращение — перетаскивание · Масштаб — колесо или щипок</div>
 <div id="message">Загружается каталог 3D-моделей…</div>
</section>
</main>
<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";
const stage=document.querySelector("#stage"), list=document.querySelector("#assetList"), search=document.querySelector("#search"), category=document.querySelector("#category"), count=document.querySelector("#count"), message=document.querySelector("#message");
const title=document.querySelector("#modelTitle"), info=document.querySelector("#modelInfo"), variant=document.querySelector("#variant");
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x131c23);
const camera=new THREE.PerspectiveCamera(42,1,.01,5000);camera.position.set(5,4,6);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.07;controls.minDistance=.15;controls.maxDistance=1000;
scene.add(new THREE.HemisphereLight(0xcfe7ff,0x29313a,2.0));
const key=new THREE.DirectionalLight(0xffffff,3.0);key.position.set(6,10,8);scene.add(key);
const fill=new THREE.DirectionalLight(0x8ccfff,1.2);fill.position.set(-7,3,-5);scene.add(fill);
const grid=new THREE.GridHelper(40,40,0x52616b,0x29343c);grid.position.y=-.015;scene.add(grid);
const loader=new GLTFLoader();let catalog=[],current=null,activeButton=null;
function resize(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
new ResizeObserver(resize).observe(stage);resize();
function human(s){return s.replace(/[-_]+/g," ").replace(/\b\w/g,c=>c.toUpperCase())}
function fit(object){const box=new THREE.Box3().setFromObject(object);const size=box.getSize(new THREE.Vector3());const center=box.getCenter(new THREE.Vector3());object.position.sub(center);const max=Math.max(size.x,size.y,size.z)||1;const distance=max/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)))*1.65;camera.position.set(distance*.9,distance*.65,distance*.95);camera.near=Math.max(.001,max/1000);camera.far=Math.max(1000,max*100);camera.updateProjectionMatrix();controls.target.set(0,0,0);controls.minDistance=max*.35;controls.maxDistance=max*15;controls.update();grid.scale.setScalar(Math.max(1,max/8));grid.position.y=-size.y*.52}
function loadModel(item,letter){message.style.display="grid";message.textContent="Загрузка 3D-модели…";if(current){scene.remove(current);current.traverse(o=>{if(o.geometry)o.geometry.dispose()});current=null}
 const url="../"+item.variants[letter];loader.load(url,gltf=>{current=gltf.scene;scene.add(current);fit(current);message.style.display="none";title.textContent=item.name;info.textContent=item.category+" · Вариант "+letter.toUpperCase()},undefined,error=>{message.style.display="grid";message.textContent="Не удалось загрузить модель. Проверьте доступность GLB-файла.";console.error(error)})}
function renderList(){const q=search.value.trim().toLowerCase(),cat=category.value;const filtered=catalog.filter(x=>(!cat||x.category===cat)&&(x.name.toLowerCase().includes(q)||x.id.toLowerCase().includes(q)));list.replaceChildren();count.textContent=filtered.length+" из "+catalog.length+" моделей";
 for(const item of filtered){const b=document.createElement("button");b.className="asset"+(activeButton===item.id?" active":"");b.type="button";const img=document.createElement("img");img.className="thumb";img.loading="lazy";img.alt="";img.src=item.preview?"../"+item.preview:"";const wrap=document.createElement("span");const name=document.createElement("span");name.className="asset-name";name.textContent=item.name;const meta=document.createElement("span");meta.className="asset-meta";meta.textContent=item.category+" · 4 варианта";wrap.append(name,meta);b.append(img,wrap);b.addEventListener("click",()=>{activeButton=item.id;document.querySelectorAll(".asset.active").forEach(x=>x.classList.remove("active"));b.classList.add("active");variant.value=item.selectedVariant||"b";loadModel(item,variant.value)});list.append(b)}
}
search.addEventListener("input",renderList);category.addEventListener("change",renderList);variant.addEventListener("change",()=>{const item=catalog.find(x=>x.id===activeButton);if(item){item.selectedVariant=variant.value;loadModel(item,variant.value)}});document.querySelector("#reset").addEventListener("click",()=>{if(current)fit(current)});
fetch("./catalog.json").then(r=>{if(!r.ok)throw new Error("catalog.json missing");return r.json()}).then(data=>{catalog=data.assets||[];const cats=[...new Set(catalog.map(x=>x.category))].sort();for(const c of cats){const o=document.createElement("option");o.value=c;o.textContent=human(c);category.append(o)}message.style.display="grid";message.textContent="Выберите модель в каталоге слева.";renderList()}).catch(err=>{message.textContent="Каталог пока не опубликован. "+err.message;count.textContent="Нет catalog.json";console.error(err)});
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();
</script>
</body>
</html>
